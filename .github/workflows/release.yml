name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create package
      run: npm run package
      
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Extract changelog section
      id: changelog
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        if [ -f CHANGELOG.md ]; then
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
        fi
        if [ ! -s release-notes.md ]; then
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes." > release-notes.md
        fi
        cat >> release-notes.md <<'EOF'

          ### Installation
          1. Download the `Twaruto.zip` file attached to this release
          2. Enable Developer Mode on your Roku device
          3. Upload the ZIP file via the [Roku Developer Application Installer](https://developer.roku.com/docs/developer-program/getting-started/developer-setup.md)
          EOF

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/Twaruto.zip
        name: Twaruto v${{ steps.version.outputs.VERSION }}
        body_path: release-notes.md

